name: Detecteur opportunites

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: detecteur-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lancer le scan
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python detecteur_alertes.py

      - name: Sauvegarder l'etat (anti-doublons)
        run: |
          git config user.name "detecteur-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alerts_state.json signals.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien a sauvegarder."
            exit 0
          fi
          git commit -m "maj etat [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Etat sauvegarde (tentative $i)."
              exit 0
            fi
            echo "Tentative $i echouee, nouvel essai dans 5s..."
            sleep 5
          done
          echo "::warning::Sauvegarde impossible apres 3 tentatives."
          echo "Le scan s'est bien deroule ; au pire une alerte pourra se repeter."
