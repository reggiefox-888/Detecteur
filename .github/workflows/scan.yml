# Détecteur d'opportunités — exécution horaire dans le cloud (GitHub Actions)
# Emplacement OBLIGATOIRE dans le dépôt : .github/workflows/scan.yml
#
# Ce fichier fait tourner detecteur_alertes.py toutes les heures sur les
# serveurs de GitHub. Les identifiants email sont lus depuis les "Secrets"
# du dépôt (Settings > Secrets and variables > Actions) — jamais en clair.
# Le fichier d'état (alerts_state.json) est sauvegardé dans le dépôt après
# chaque scan, ce qui évite les alertes en double d'une exécution à l'autre.
#
# Notes honnêtes :
#  - L'horaire GitHub peut glisser de quelques minutes : sans importance ici.
#  - Dépôt PRIVÉ recommandé. Quota gratuit : 2000 min/mois ; ce scan en
#    consomme environ 700-900. Ça tient.
#  - L'onglet "Actions" > exécution > logs montre la sortie console de
#    chaque scan : c'est là qu'on lira les éventuelles erreurs de paires.

name: Detecteur opportunites

on:
  schedule:
    - cron: "7 * * * *"        # chaque heure, à h+07 (UTC)
  workflow_dispatch: {}         # bouton "Run workflow" pour tester à la main

permissions:
  contents: write               # nécessaire pour sauvegarder l'état

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer le scan
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python detecteur_alertes.py

      - name: Sauvegarder l'etat (anti-doublons)
        run: |
          git config user.name "detecteur-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alerts_state.json signals.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "maj etat [skip ci]"
          git push
